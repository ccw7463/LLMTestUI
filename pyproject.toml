[tool.poetry]
name = "llmtestui"
version = "0.1.0"
description = ""
authors = ["ccw7463 <ccw7463@example.com>"]
readme = "README.md"

# 포함할 패키지 지정
packages = [
    { include = "log" },
    { include = "scripts" },
    { include = "src" },
    { include = "configs", from = "src" },
    { include = "modules", from = "src" },
    { include = "utils", from = "src" },
    { include = "unittests" }
]

[tool.poetry.dependencies]
python = "^3.11"
ml-collections = "^1.0.0"
redis = "^5.2.1"
pytz = "^2025.1"
transformers = "^4.49.0"
langchain = "^0.3.20"
langchain-community = "^0.3.19"
chainlit = "^2.4.1"
langchain-huggingface = "^0.1.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
